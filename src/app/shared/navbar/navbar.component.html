<header class="navbar">
  <a class="brand" routerLink="/products">
    <span class="brand-mark">◆</span>
    <span class="brand-name">SmartShop</span>
    <span class="brand-tag mono">/ai</span>
  </a>

  <nav class="nav-actions">
    @if (authService.isLoggedIn()) {
      <span class="user">
        {{ authService.userEmail() }}
        @if (authService.isAdmin()) {
          <span class="role mono">admin</span>
        }
      </span>
      <button mat-button (click)="logout()">
        <mat-icon>logout</mat-icon>
        Sign out
      </button>
    } @else {
      <button mat-button routerLink="/login">Sign in</button>
      <button mat-raised-button color="primary" routerLink="/register">Get started</button>
    }
  </nav>
</header>
