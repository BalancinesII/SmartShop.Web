<div class="auth-layout">
  <aside class="brand-panel">
    <div class="brand-panel-inner">
      <span class="brand-logo">◆ SmartShop <span class="mono brand-logo-tag">/ai</span></span>
      <h2 class="brand-headline">Ship your store in an afternoon.</h2>
      <p class="brand-copy">
        Skip the boilerplate. Auth, roles, payments and an AI assistant — already wired up.
      </p>
    </div>
  </aside>

  <main class="form-panel">
    <div class="form-inner">
      <h1 class="form-title">Create account</h1>
      <p class="form-sub">Join in a few seconds. No credit card required.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="field-row">
          <label class="field">
            <span class="field-label">First name</span>
            <input formControlName="firstName" autocomplete="given-name" placeholder="Jane" />
          </label>
          <label class="field">
            <span class="field-label">Last name</span>
            <input formControlName="lastName" autocomplete="family-name" placeholder="Doe" />
          </label>
        </div>

        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <input type="password" formControlName="password" autocomplete="new-password" placeholder="At least 6 characters" />
        </label>

        @if (errorMessage()) {
          <p class="error">{{ errorMessage() }}</p>
        }

        <button type="submit" class="submit-btn" [disabled]="form.invalid || loading()">
          @if (loading()) { <span class="btn-spinner"></span> } @else { Create account }
        </button>
      </form>

      <p class="footer-link">
        Already have an account? <a routerLink="/login">Sign in</a>
      </p>
    </div>
  </main>
</div>
