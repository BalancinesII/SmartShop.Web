<div class="auth-layout">
  <!-- Brand panel — reinforces identity and reminds this is a dev product -->
  <aside class="brand-panel">
    <div class="brand-panel-inner">
      <span class="brand-logo">◆ SmartShop <span class="mono brand-logo-tag">/ai</span></span>
      <h2 class="brand-headline">The AI-native e-commerce starter kit.</h2>
      <p class="brand-copy">
        .NET&nbsp;8 · Angular · Stripe · Claude — production-ready, deployed on Azure.
      </p>
    </div>
  </aside>

  <!-- Form panel -->
  <main class="form-panel">
    <div class="form-inner">
      <h1 class="form-title">Sign in</h1>
      <p class="form-sub">Welcome back. Enter your details to continue.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
        </label>

        @if (errorMessage()) {
          <p class="error">{{ errorMessage() }}</p>
        }

        <button type="submit" class="submit-btn" [disabled]="form.invalid || loading()">
          @if (loading()) { <span class="btn-spinner"></span> } @else { Sign in }
        </button>
      </form>

      <p class="footer-link">
        Don't have an account? <a routerLink="/register">Create one</a>
      </p>
    </div>
  </main>
</div>
