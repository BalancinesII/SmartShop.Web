@if (open()) {
  <div class="chat-panel">
    <div class="chat-header">
      <span class="chat-title">
        <span class="dot"></span>
        SmartShop Assistant
      </span>
      <span class="chat-tag mono">AI</span>
    </div>

    <div class="chat-messages">
      @for (message of messages(); track $index) {
        <div class="message" [class.user]="message.role === 'user'" [innerHTML]="renderMessage(message.text)"></div>
      }

      @if (sending()) {
        <div class="message assistant typing">
          <mat-spinner diameter="16"></mat-spinner>
        </div>
      }
    </div>

    <form class="chat-input" (ngSubmit)="send()">
      <input
        class="chat-field"
        [(ngModel)]="draft"
        name="draft"
        placeholder="Type your message…"
        autocomplete="off"
      />
      <button
        class="send-btn"
        type="submit"
        [disabled]="!draft.trim() || sending()"
        aria-label="Send message"
      >
        <mat-icon>arrow_upward</mat-icon>
      </button>
    </form>
  </div>
}

<button class="chat-fab" (click)="toggle()" [attr.aria-label]="open() ? 'Close chat' : 'Open chat'">
  <mat-icon>{{ open() ? 'close' : 'chat_bubble' }}</mat-icon>
</button>
